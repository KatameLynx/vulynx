[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulynx"
version = "0.1.0"
description = "Python web vulnerability scanner: SQLi, XSS, Open Redirect, Broken Auth, Security Headers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "KatameLynx" },
]
keywords = [
    "security",
    "vulnerability-scanner",
    "pentest",
    "sqli",
    "xss",
    "owasp",
    "bug-bounty",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "flask>=2.3.0",
    "pytest>=7.0.0",
]

[project.scripts]
vulynx = "vulynx.cli:main"

[project.urls]
Homepage = "https://github.com/KatameLynx/vulynx"
Repository = "https://github.com/KatameLynx/vulynx"
Issues = "https://github.com/KatameLynx/vulynx/issues"

[tool.setuptools.packages.find]
include = ["vulynx*"]